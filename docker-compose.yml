version: "3.8"

services:
  pyspark:
    build: .
    container_name: pyspark311-jdk17-lab7
    ports:
      - "8889:8888"
    volumes:
      - ./data:/opt/app/data
      - ./notebooks:/opt/app/notebooks
      - ./src:/opt/app/src
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - PYSPARK_PYTHON=/usr/local/bin/python
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --NotebookApp.token=''
      --notebook-dir=/opt/app
